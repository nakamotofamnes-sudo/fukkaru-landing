name: ブログを書く（1日2本＋書き直し1本）

# Mac が眠っていても記事が出るようにするための入口（2026-09-02）。
#
# ⚠ **ここが本番です**（2026-09-02 に Mac から移しました）。
#    Mac の autoupload.sh からは blog を外してあります。
#    戻すときは両方を同時に。**片方だけだと本数が狂います。**
#
# 1日2本に増やしました（2026-09-09）。1本に戻すときは、下の cron を1行消すだけです。
on:
  schedule:
    # **1日2本（2026-09-09、中元さんの判断）。**
    # それまでは10時の1本だけでした。
    # 2本を1回で書かず、**時間を離して2回走らせます。**
    # 理由：1回で2本書くと、1本目で失敗したとき2本目も道連れになります。
    #       やり直しの弁（短すぎ・裏付けのない数字）も1本ずつ働かせたい。
    - cron: '0 1 * * *'      # 毎日 10:00（日本時間。UTCで書く決まり）
    - cron: '0 7 * * *'      # 毎日 16:00（日本時間）
    # **書き直し（2026-10-18〜）。**公開済みの記事を1本、AIで書き直してPRを作る。
    # 中元さん 10/13「２本残して書き直しを足すにしてください」＝新しい記事の2本はそのまま、13時に足す（10時・16時と重ならない所）。
    # **はじめの1週間は自動でマージしない**（下の FUKKARU_KAKINAOSHI_AUTOMERGE）。この1行を消せば、書き直しだけ止まる
    - cron: '0 4 * * *'      # 毎日 13:00（日本時間）
  workflow_dispatch:
    inputs:
      mode:
        description: '試し運転（dry）なら公開しません。live で本当に出します'
        type: choice
        # ⚠ ここに on と書くと YAML が「真」と読んでしまい、選択肢として使えない
        # kakinaoshi-dry … 書き直しの試し（公開しない）／kakinaoshi … 書き直してPRを作る
        options: [dry, live, kakinaoshi-dry, kakinaoshi]
        default: dry
      target:
        description: '狙いを1回だけ指定（例 物置組立:富士市）。空なら狙い.txt の順番どおり'
        type: string
        default: ''
      kiji:
        description: '書き直しで、記事を1本だけ指定（住所。例 fuji-monooki-kumitate-junbi-benriya）。空なら選ぶ順どおり'
        type: string
        default: ''

jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BLOG_PAT }}

      - name: 日本語の書体を入れる
        # Ubuntu にはヒラギノが無い。トップ画像の文字が豆腐になるので必ず入れる
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 画像の道具を入れる
        run: pip install --quiet Pillow

      - name: 誰がコミットするか決める
        run: |
          git config user.name  "フッ軽の自動投稿"
          git config user.email "nakamoto.famnes@gmail.com"

      - name: 記事を書く
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.BLOG_PAT }}
          FUKKARU_REPO: ${{ github.workspace }}
          FUKKARU_STATE: ${{ github.workspace }}/scripts/blog/state
          FUKKARU_TARGETS: ${{ github.workspace }}/scripts/blog/狙い.txt
          FUKKARU_CURSOR: ${{ github.workspace }}/scripts/blog/狙い_いまの位置.txt
          FUKKARU_HEROIMG: ${{ github.workspace }}/scripts/blog/heroimg.py
          # index は言語の違い。0 が日本語。太字は別ファイルにある
          FUKKARU_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          FUKKARU_FONT_BOLD: /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
          # 13時の定時は書き直し。手で動かすときは mode の選択どおり。それ以外（10時・16時・live）は新しい記事
          FUKKARU_BLOG_MODE: ${{ github.event.schedule == '0 4 * * *' && 'kakinaoshi' || (inputs.mode == 'dry' && 'dry') || (inputs.mode == 'kakinaoshi' && 'kakinaoshi') || (inputs.mode == 'kakinaoshi-dry' && 'kakinaoshi-dry') || 'on' }}
          FUKKARU_KAKINAOSHI_SLUG: ${{ inputs.kiji }}
          # **書き直しは、はじめの1週間は自動でマージしない**（毎日の記事読みで読んでから、人がマージする）。
          # よければ '1' にすると、新しい記事と同じく自動で公開する
          FUKKARU_KAKINAOSHI_AUTOMERGE: '0'
          # 書き直しの選ぶ順②（検索で10位より下）に使う、サーチコンソールを読むだけの鍵。
          # 金庫に入っていなければ空になり、②を飛ばして③（古い順）へ進む
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          FUKKARU_BLOG_FORCE: '1'
          FUKKARU_BLOG_TARGET: ${{ inputs.target }}
        run: python3 scripts/blog/blog.py

      - name: 記録を出す
        if: always()
        run: cat scripts/blog/state/_ログ.txt 2>/dev/null || echo "記録がありません"

      - name: 入っている日本語の書体を見る
        if: always()
        run: |
          ls -la /usr/share/fonts/opentype/noto/ 2>/dev/null || echo "noto のフォルダがありません"
          python3 - <<'PY'
          from PIL import ImageFont
          import glob
          for f in sorted(glob.glob('/usr/share/fonts/opentype/noto/*.ttc')):
              for i in range(12):
                  try:
                      ft = ImageFont.truetype(f, 20, index=i)
                      print(i, f.split('/')[-1], '->', ft.getname())
                  except Exception:
                      break
          PY

      - name: できた画像を見られるようにする
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: できた記事とトップ画像
          path: |
            public/blog/*.jpg
            content/articles/*.json
          retention-days: 3
          if-no-files-found: warn
