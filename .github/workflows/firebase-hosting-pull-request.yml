# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FUKKARU_APP }}
          projectId: fukkaru-app
          # 仮ページの寿命。**これが無いと7日間残り、上限50本にぶつかる。**
          # 2026-09-07に実際に詰まった：51本（本番1＋仮50）で
          # 「RESOURCE_EXHAUSTED」。8回続けて赤い×が出ていた。
          # 本番に出す側は無事だったが、**赤い×が並ぶと本当の失敗に気づけない。**
          # ブログが毎日PRを作るので、1日で消えるようにしておく。
          expires: 1d
