<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TikTokとのつなぎ込み｜フッ軽</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f8fafc;color:#0f172a}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px}
h1{font-size:20px;margin:0 0 16px}
p{font-size:15px;line-height:1.8;margin:0 0 12px}
.box{border:1px solid #e2e8f0;border-radius:8px;background:#fff;padding:16px;margin:16px 0}
.ng{color:#b91c1c}
</style>
</head>
<body>
<div class="wrap">
  <h1>TikTokとのつなぎ込み</h1>
  <div class="box" id="kekka"><p>読み込んでいます…</p></div>
  <p>このページは、フッ軽の管理用です。検索には出しません。</p>
</div>
<script>
// 2026-09-16：TikTok の「試しに使える形（サンドボックス）」でログインしたあと戻ってくるページ。
// 受け取った code はこのページの外に送らない。表示するのは「つなぎ込みが済んだかどうか」だけ。
(function () {
  var q = new URLSearchParams(location.search);
  var el = document.getElementById('kekka');
  if (q.get('error')) {
    el.innerHTML = '<p class="ng">つなぎ込みができませんでした。</p><p>もう一度、最初のリンクからやり直してください。</p>';
  } else if (q.get('code')) {
    el.innerHTML = '<p><strong>TikTokでの許可が済みました。</strong></p><p>このあとの手順は、Claude のチャットでご案内します。このページはまだ閉じないでください。</p>';
  } else {
    el.innerHTML = '<p>このページは、TikTokでログインしたあとに開くページです。</p>';
  }
})();
</script>
</body>
</html>
